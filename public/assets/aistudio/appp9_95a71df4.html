    // Haversine formula to compute distance in metres
    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Earth radius in metres
      const φ1 = (lat1 * Math.PI) / 180;
      const φ2 = (lat2 * Math.PI) / 180;
      const Δφ = ((lat2 - lat1) * Math.PI) / 180;
      const Δλ = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
        Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

            "Full perimeter closure / surface compaction flush with existing bitumen",
            "Clearance of all residual materials, gravel, or wastewater",
            "Timestamped and GPS geotagged photo proof uploaded by ward supervisor"
          ]
        };
      };

      // Submit Report Handler
      const handleFormSubmit = async (e) => {
        e.preventDefault();
        setFormError('');

        if (!formDesc || formDesc.trim().length < 5) {
          setFormError("Please enter a clear description or landmark (minimum 5 characters).");
          return;
        }

        setIsAnalyzing(true);
        setAiResult(null);

        try {
          const triageOutput = await executeGeminiTriage({
            photo: formPhoto,
            category: formCategory,
            zone: formZone,
            address: formAddress,
            desc: formDesc,
            nearbyMatch: detectedNearbyDuplicate
          });

          setAiResult(triageOutput);

          const newTicketId = `CP-${Math.floor(100 + Math.random() * 900)}`;
          const nowStr = new Date().toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });

          const newTicket = {
            id: newTicketId,
            title: formDesc.slice(0, 50) + (formDesc.length > 50 ? '...' : ''),
            category: triageOutput.detectedCategory,
            zone: formZone,
            address: formAddress || `${formZone}, Visakhapatnam`,
            latitude: formLat,
            longitude: formLng,
            description: formDesc,
            imageUrl: formPhoto,
            status: "Pending", // Standard initial status
            urgencyScore: triageOutput.urgencyScore,
            urgencyLevel: triageOutput.urgencyLevel,
            upvotes: 1,
            reportedAt: nowStr,
            isSample: false,
            duplicateCount: triageOutput.isDuplicate ? 2 : 1,
            bundledTicketIds:
              triageOutput.isDuplicate && triageOutput.duplicateMatchTicketId
                ? [triageOutput.duplicateMatchTicketId]
                : [],
            assignedDepartment: triageOutput.assignedDepartment,
            assignedOfficer: triageOutput.assignedOfficer,
            estimatedSlaHours: triageOutput.estimatedSlaHours,
            adminNotes: "Complaint logged and auto-triaged by CivicPulse AI. Awaiting field inspection.",
            aiVerificationDetails: {
              hazardFactors: triageOutput.hazardFactors,
              triageReasoning: triageOutput.triageReasoning,
              photoProofStatus: "Pending Resolution",
              commuterImpact: triageOutput.commuterImpact
            }
          };

          setTickets(prev => [newTicket, ...prev]);
          setHighlightedTicket(newTicket);
        } catch (err) {
          console.error("Submission failed:", err);
          setFormError("AI Triage could not be completed. Please try again.");
        } finally {
          setIsAnalyzing(false);
        }
      };

      // Preset Quick Test Switcher
      const applyPreset = (preset) => {
        setFormPhoto(preset.url);
        setFormCategory(preset.category);
        setFormZone(preset.zone);
        setFormLat(preset.lat);
        setFormLng(preset.lng);
        setFormDesc(preset.desc);
        setFormAddress(`${preset.desc.split('near ')[1] || preset.zone}, Visakhapatnam`);
        setFormGpsStatus(`${preset.zone} Preset Coordinates Locked (${preset.lat}, ${preset.lng})`);
      };

      // Admin Status & Notes Update Handler
      const handleSaveAdminUpdate = (ticketId) => {
        setTickets(prev =>
          prev.map(t => {
            if (t.id === ticketId) {
              return {
                ...t,
                status: adminNewStatus,
                adminNotes: adminNewNotes || t.adminNotes,
                resolvedImageUrl: adminProofUrl ? adminProofUrl : t.resolvedImageUrl,
                aiVerificationDetails: {
                  ...t.aiVerificationDetails,
                  photoProofStatus:
                    adminNewStatus === "Resolved (Photo Verified)"
                      ? "Verified by Official Photo Proof"
                      : "Pending Resolution"
                }
              };
            }
            return t;
          })
        );
        alert(`Ticket #${ticketId} status successfully updated to "${adminNewStatus}"!`);
        setEditingTicket(null);
      };

      // Filtered Tickets for Live Tracking
      const filteredTickets = useMemo(() => {
        return tickets.filter(ticket => {
          if (selectedZone !== 'all' && ticket.zone !== selectedZone) return false;
          if (selectedCategory !== 'all' && ticket.category !== selectedCategory) return false;
          if (selectedStatus !== 'all' && ticket.status !== selectedStatus) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = ticket.title.toLowerCase().includes(q);
            const matchDesc = ticket.description.toLowerCase().includes(q);
            const matchZone = ticket.zone.toLowerCase().includes(q);
            const matchCat = ticket.category.toLowerCase().includes(q);
            const matchId = ticket.id.toLowerCase().includes(q);
            if (!matchTitle && !matchDesc && !matchZone && !matchCat && !matchId) return false;
          }
          return true;
        });
      }, [tickets, selectedZone, selectedCategory, selectedStatus, searchQuery]);

      // Leaflet Map Initialization on Live Tracking Tab
      useEffect(() => {
        if (currentTab === 'tracker') {
          const mapEl = document.getElementById('map');
          if (!mapEl) return;

          if (window._vizagMap) {
            window._vizagMap.remove();
          }

          // 1. High-Resolution Esri World Imagery (Satellite) with proper CORS headers
          const esriSatellite = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
              attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and GIS User Community',
              maxZoom: 19,
              crossOrigin: 'anonymous',
              subdomains: ['server', 'services']
            }
          );

          // 2. Esri Boundaries and Places (Labels for Hybrid satellite overlay)
          const esriLabels = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
            {
              attribution: 'Labels &copy; Esri',
              maxZoom: 19,
              crossOrigin: 'anonymous',
              pane: 'shadowPane'
            }
          );

          // 3. Esri Satellite Hybrid Layer Group (Imagery + Landmark Labels)
          const esriHybrid = L.layerGroup([
            L.tileLayer(
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
              {
                maxZoom: 19,
                crossOrigin: 'anonymous'
              }
            ),
            L.tileLayer(
              'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
              {
                maxZoom: 19,
                crossOrigin: 'anonymous'
              }
            )
          ]);

          // 4. Standard OpenStreetMap Street Layer
          const osmStreet = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | CivicPulse Vizag',
            maxZoom: 19,
            crossOrigin: 'anonymous'
          });

          // Initialize Map with High-Resolution Esri Satellite as the default base layer
          const map = L.map('map', {
            center: [17.7385, 83.3250],
            zoom: 12,
            layers: [esriSatellite]
          });
          window._vizagMap = map;

          // Layer Group for Civic Hazard Markers
          const markersGroup = L.layerGroup().addTo(map);

          // Add color-coded pins for all filtered complaints
          filteredTickets.forEach(ticket => {
            const isResolved = ticket.status === "Resolved (Photo Verified)";
            const isInProgress = ticket.status === "In Progress";
            const markerColor = isResolved ? '#16a34a' : isInProgress ? '#d97706' : '#0284c7';

            const customIcon = L.divIcon({
              className: 'custom-pin',
              html: `<div style="background-color: ${markerColor}; width: 22px; height: 22px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;"><span style="width: 7px; height: 7px; background: white; border-radius: 50%;"></span></div>`,
              iconSize: [22, 22],
              iconAnchor: [11, 11]
            });

            const marker = L.marker([ticket.latitude, ticket.longitude], { icon: customIcon });
            marker.bindPopup(`
              <div style="font-size: 13px; min-width: 200px; padding: 2px;">
                <span style="display:inline-block; padding: 2px 6px; font-size: 10px; font-weight: bold; border-radius: 4px; background: #e0f2fe; color: #0369a1; margin-bottom: 4px;">${ticket.id} • ${ticket.zone}</span>
                <strong style="display:block; margin-bottom: 4px; color: #0f172a; font-size: 13px; line-height: 1.3;">${ticket.title}</strong>
                <div style="font-size: 11px; color: #64748b; margin-bottom: 4px;">${ticket.category}</div>
                <div style="font-size: 11px; margin-bottom: 6px; color: #334155;">📍 ${ticket.address}</div>
                <div style="display:flex; justify-content:space-between; align-items:center; border-top: 1px solid #e2e8f0; padding-top: 4px;">
                  <span style="font-weight: bold; color: ${markerColor}; font-size: 11px;">● ${ticket.status}</span>
                  <span style="font-size: 11px; font-weight: bold; color: #dc2626;">${ticket.urgencyScore} / 10 Urgency</span>
                </div>
              </div>
            `);
            markersGroup.addLayer(marker);
          });

          // Configure Leaflet Map Layer Switcher (Satellite vs Street vs Hybrid)
          const baseLayers = {
            "🛰️ Esri Satellite (High-Res)": esriSatellite,
            "🛰️ Satellite + Labels (Hybrid)": esriHybrid,
            "🗺️ Street Map (OSM)": osmStreet
          };

          const overlayLayers = {
            "📍 Civic Hazard Pins": markersGroup
          };

          L.control.layers(baseLayers, overlayLayers, {
            position: 'topright',
            collapsed: false
          }).addTo(map);

          // Invalidate size to ensure smooth rendering without tile blocks
          setTimeout(() => {
            map.invalidateSize();
          }, 250);
        }
      }, [currentTab, filteredTickets]);

      return (
        <div className="flex-1 flex flex-col">
          {/* Top Navigation Bar */}
          <header className="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                {/* Brand / Logo */}
                <div
                  className="flex items-center space-x-3 cursor-pointer select-none"
                  onClick={() => setCurrentTab('home')}
                >
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-500 flex items-center justify-center text-white shadow-md">
                    <i data-lucide="shield-alert" className="w-6 h-6"></i>
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <span className="font-extrabold text-xl text-slate-900 tracking-tight">{t.appName}</span>
                      <span className="text-xs bg-brand-100 text-brand-800 font-bold px-2 py-0.5 rounded-full border border-brand-200">
                        Vizag
                      </span>
                    </div>
                    <p className="text-xs text-slate-500 hidden sm:block">{t.appSubname}</p>
                  </div>
                </div>

                {/* Primary Navigation Tabs */}
                <nav className="flex items-center space-x-1 sm:space-x-2 text-sm font-medium">
                  <button
                    onClick={() => setCurrentTab('home')}
                    className={`px-3 py-2 rounded-lg transition-colors flex items-center space-x-1.5 ${
                      currentTab === 'home'
                        ? 'bg-brand-50 text-brand-700 font-bold border border-brand-200'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    <i data-lucide="home" className="w-4 h-4"></i>
                    <span className="hidden md:inline">{t.navHome}</span>
                  </button>

                  <button
                    onClick={() => setCurrentTab('report')}
                    className={`px-3 py-2 rounded-lg transition-colors flex items-center space-x-1.5 ${
                      currentTab === 'report'
                        ? 'bg-brand-50 text-brand-700 font-bold border border-brand-200'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    <i data-lucide="camera" className="w-4 h-4"></i>
                    <span>{t.navReport}</span>
                  </button>

                  <button
                    onClick={() => setCurrentTab('tracker')}
                    className={`px-3 py-2 rounded-lg transition-colors flex items-center space-x-1.5 ${
                      currentTab === 'tracker'
                        ? 'bg-brand-50 text-brand-700 font-bold border border-brand-200'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    <i data-lucide="activity" className="w-4 h-4"></i>
                    <span className="hidden md:inline">{t.navTracker}</span>
                    <span className="bg-brand-600 text-white text-xs px-1.5 py-0.2 rounded-full font-bold ml-1">
                      {tickets.length}
                    </span>
                  </button>

                  <button
                    onClick={() => setCurrentTab('admin')}
                    className={`px-3 py-2 rounded-lg transition-colors flex items-center space-x-1.5 ${
                      currentTab === 'admin'
                        ? 'bg-amber-50 text-amber-800 font-bold border border-amber-300'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    <i data-lucide="shield" className="w-4 h-4 text-amber-600"></i>
                    <span className="hidden lg:inline">{t.navAdmin}</span>
                    <span className="lg:hidden">Admin</span>
                  </button>

                  <button
                    onClick={() => setCurrentTab('about')}
                    className={`px-3 py-2 rounded-lg transition-colors flex items-center space-x-1.5 ${
                      currentTab === 'about'
                        ? 'bg-brand-50 text-brand-700 font-bold border border-brand-200'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    <i data-lucide="file-text" className="w-4 h-4"></i>
                    <span className="hidden xl:inline">{t.navAbout}</span>
                  </button>
                </nav>

                {/* Right Controls: Language & Reset */}
                <div className="flex items-center space-x-2">
                  {/* English / Telugu Toggle */}
                  <div className="flex bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-xs font-semibold">
                    <button
                      onClick={() => setLang('en')}
                      className={`px-2.5 py-1 rounded-md transition-all ${
                        lang === 'en' ? 'bg-white text-brand-800 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      EN
                    </button>
                    <button
                      onClick={() => setLang('te')}
                      className={`px-2.5 py-1 rounded-md transition-all ${
                        lang === 'te' ? 'bg-white text-brand-800 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      తెలుగు
                    </button>
                  </div>

                  {/* Reset Sample Data Button */}
                  <button
                    onClick={handleResetData}
                    title="Reset to original Vizag sample complaints"
                    className="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                  >
                    <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                  </button>

                  {/* Optional Gemini API Key Dialog */}
                  <button
                    onClick={() => setShowApiKeyModal(true)}
                    title="Configure Live Gemini API Key (Optional)"
                    className={`p-2 rounded-lg transition-colors ${
                      userApiKey ? 'text-civicgreen-600 bg-civicgreen-50' : 'text-slate-500 hover:text-brand-600 hover:bg-brand-50'
                    }`}
                  >
                    <i data-lucide="key" className="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* Main Views */}
          <main className="flex-1">
            {currentTab === 'home' && (
              <HomeScreen
                t={t}
                setCurrentTab={setCurrentTab}
                tickets={tickets}
                onSelectZone={(zone) => {
                  setSelectedZone(zone);
                  setCurrentTab('tracker');
                }}
              />
            )}

            {currentTab === 'report' && (
              <ReportScreen
                t={t}
                formPhoto={formPhoto}
                setFormPhoto={setFormPhoto}
                formCategory={formCategory}
                setFormCategory={setFormCategory}
                formZone={formZone}
                setFormZone={setFormZone}
                formLat={formLat}
                setFormLat={setFormLat}
                formLng={formLng}
                setFormLng={setFormLng}
                formAddress={formAddress}
                setFormAddress={setFormAddress}
                formDesc={formDesc}
                setFormDesc={setFormDesc}
                formGpsStatus={formGpsStatus}
                isCapturingGps={isCapturingGps}
                handleCaptureLiveGPS={handleCaptureLiveGPS}
                fileInputRef={fileInputRef}
                handleFileUpload={handleFileUpload}
                isAnalyzing={isAnalyzing}
                aiResult={aiResult}
                formError={formError}
                detectedNearbyDuplicate={detectedNearbyDuplicate}
                handleFormSubmit={handleFormSubmit}
                applyPreset={applyPreset}
                highlightedTicket={highlightedTicket}
                setCurrentTab={setCurrentTab}
                onUpvoteExisting={(id) => {
                  handleUpvote(id);
                  alert(`Upvoted ticket #${id}! Merged complaint into existing priority ticket.`);
                  setCurrentTab('tracker');
                }}
              />
            )}

            {currentTab === 'tracker' && (
              <TrackerResultScreen
                t={t}
                tickets={filteredTickets}
                allTicketsCount={tickets.length}
                selectedZone={selectedZone}
                setSelectedZone={setSelectedZone}
                selectedCategory={selectedCategory}
                setSelectedCategory={setSelectedCategory}
                selectedStatus={selectedStatus}
                setSelectedStatus={setSelectedStatus}
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
                handleUpvote={handleUpvote}
                highlightedTicket={highlightedTicket}
                setActiveModalTicket={setActiveModalTicket}
                setCurrentTab={setCurrentTab}
              />
            )}

            {currentTab === 'admin' && (
              <AdminDashboardScreen
                t={t}
                tickets={tickets}
                adminSelectedDept={adminSelectedDept}
                setAdminSelectedDept={setAdminSelectedDept}
                editingTicket={editingTicket}
                setEditingTicket={setEditingTicket}
                adminNewStatus={adminNewStatus}
                setAdminNewStatus={setAdminNewStatus}
                adminNewNotes={adminNewNotes}
                setAdminNewNotes={setAdminNewNotes}
                adminProofUrl={adminProofUrl}
                setAdminProofUrl={setAdminProofUrl}
                handleSaveAdminUpdate={handleSaveAdminUpdate}
                setActiveModalTicket={setActiveModalTicket}
              />
            )}

            {currentTab === 'about' && <AboutScreen t={t} />}
          </main>

          {/* Photo-Proof Resolution Inspection Modal */}
          {activeModalTicket && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-2xl w-full shadow-2xl border border-slate-200 overflow-hidden flex flex-col max-h-[90vh]">
                <div className="p-4 sm:p-6 bg-slate-900 text-white flex items-center justify-between">
                  <div>
                    <span className="text-xs font-mono uppercase tracking-wider text-brand-400 font-bold">
                      {activeModalTicket.id} • {activeModalTicket.zone}
                    </span>
                    <h3 className="text-lg font-bold text-white mt-0.5">{t.resolveModalTitle}</h3>
                  </div>
                  <button
                    onClick={() => {
                      setActiveModalTicket(null);
                      setResolutionFeedback(null);
                    }}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="p-4 sm:p-6 overflow-y-auto space-y-6">
                  {/* Before & After Photo Proof */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold uppercase text-red-600 bg-red-50 px-2 py-0.5 rounded">
                          {t.beforePhoto}
                        </span>
                        <span className="text-xs text-slate-500">Reported</span>
                      </div>
                      <div className="aspect-video rounded-xl overflow-hidden bg-slate-100 border border-slate-200">
                        <img
                          src={activeModalTicket.imageUrl}
                          alt="Before civic hazard"
                          className="w-full h-full object-cover"
                        />
                      </div>
                    </div>

                    <div className="space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold uppercase text-civicgreen-700 bg-civicgreen-50 px-2 py-0.5 rounded">
                          {t.afterPhoto}
                        </span>
                        <span className="text-xs text-slate-500">GVMC Field Proof</span>
                      </div>
                      <div className="aspect-video rounded-xl overflow-hidden bg-slate-100 border border-slate-200">
                        <img
                          src={
                            activeModalTicket.resolvedImageUrl ||
                            "https://images.unsplash.com/photo-1541888946425-d0fbb1861593?auto=format&fit=crop&w=600&q=80"
                          }
                          alt="After repair proof"
                          className="w-full h-full object-cover"
                        />
                      </div>
                    </div>
                  </div>

                  {/* Ward Details */}
                  <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 space-y-2 text-sm">
                    <div className="flex items-center justify-between">
                      <span className="font-semibold text-slate-700">Department:</span>
                      <span className="text-slate-900 font-medium">{activeModalTicket.assignedDepartment}</span>
                    </div>
                    <div className="flex items-center justify-between">
                      <span className="font-semibold text-slate-700">Ward Officer:</span>
                      <span className="text-slate-900 font-medium">{activeModalTicket.assignedOfficer}</span>
                    </div>
                    {activeModalTicket.adminNotes && (
                      <div className="pt-2 border-t border-slate-200 text-xs">
                        <span className="font-bold text-slate-700 block mb-0.5">Official Inspection Remarks:</span>
                        <p className="text-slate-600 italic">"{activeModalTicket.adminNotes}"</p>
                      </div>
                    )}
                  </div>

                  {/* Citizen Verification Feedback */}
                  {resolutionFeedback ? (
                    <div className="p-4 rounded-xl bg-civicgreen-50 border border-civicgreen-200 text-civicgreen-800 text-sm flex items-center space-x-2">
                      <i data-lucide="check-check" className="w-5 h-5 text-civicgreen-600 flex-shrink-0"></i>
                      <span>Thank you! Your citizen verification vote has been logged into the public ward audit ledger.</span>
                    </div>
                  ) : (
                    <div className="space-y-2">
                      <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block">
                        Citizen RWA Verification Action
                      </label>
                      <div className="grid grid-cols-2 gap-3">
                        <button
                          onClick={() => setResolutionFeedback('approved')}
                          className="py-2.5 px-4 bg-civicgreen-600 hover:bg-civicgreen-700 text-white font-semibold rounded-xl text-sm transition-colors flex items-center justify-center space-x-2 shadow-sm"
                        >
                          <i data-lucide="thumbs-up" className="w-4 h-4"></i>
                          <span>{t.confirmResolution}</span>
                        </button>
                        <button
                          onClick={() => setResolutionFeedback('flagged')}
                          className="py-2.5 px-4 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-300 font-semibold rounded-xl text-sm transition-colors flex items-center justify-center space-x-2"
                        >
                          <i data-lucide="flag" className="w-4 h-4"></i>
                          <span>{t.rejectResolution}</span>
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                <div className="p-4 bg-slate-50 border-t border-slate-200 flex justify-end">
                  <button
                    onClick={() => {
                      setActiveModalTicket(null);
                      setResolutionFeedback(null);
                    }}
                    className="px-5 py-2 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-medium text-sm transition-colors"
                  >
                    Close Inspection
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Gemini API Key Configuration Modal */}
